org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
kotlin.code.style=official

# ============================================================================
# VoiceCloud Android live server authority (PH01-R08 and all following phases)
# ============================================================================
# EDIT THESE THREE VALUES when the Raspberry Pi / VoiceCloud server URL changes.
# The API resolver automatically appends /api/v1/ to the API origin.
# Socket.IO uses the same origin with namespace /realtime and path /socket.io.
# The Web URL is used for public/deep-link/browser authorities.
VOICECLOUD_DEBUG_API_BASE_URL=https://voicecloud.tailfca77b.ts.net
VOICECLOUD_DEBUG_SOCKET_BASE_URL=https://voicecloud.tailfca77b.ts.net
VOICECLOUD_DEBUG_WEB_BASE_URL=https://voicecloud.tailfca77b.ts.net

# Staging/release inherit the live debug authority while Android is being developed
# against the Raspberry Pi server. Set any of these only when a separate environment
# is intentionally introduced.
VOICECLOUD_STAGING_API_BASE_URL=
VOICECLOUD_STAGING_SOCKET_BASE_URL=
VOICECLOUD_STAGING_WEB_BASE_URL=
VOICECLOUD_RELEASE_API_BASE_URL=
VOICECLOUD_RELEASE_SOCKET_BASE_URL=
VOICECLOUD_RELEASE_WEB_BASE_URL=


# Optional PH02 Google/Firebase public client configuration.
# These are public client identifiers (never Firebase Admin private keys). When blank, Google sign-in
# stays unavailable while email/phone/guest authentication remains fully usable.
VOICECLOUD_GOOGLE_WEB_CLIENT_ID=
VOICECLOUD_FIREBASE_API_KEY=
VOICECLOUD_FIREBASE_APPLICATION_ID=
VOICECLOUD_FIREBASE_PROJECT_ID=
